[project]
name = "tawi-backend"
version = "0.1.0"
description = "TAWI 2.0 backend — speech enhancement, transcription, accounts and session APIs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2,<0.29.0",
    "pytest>=8.3.3,<9.0.0",
    "ruff>=0.7.0,<0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
