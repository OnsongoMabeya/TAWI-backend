[project]
name = "tawi-backend"
version = "0.2.0"
description = "TAWI 2.0 backend — speech enhancement, transcription, accounts and session APIs"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0,<1.16.0",
    "argon2-cffi>=23.1.0,<25.2.0",
    "asyncpg>=0.30.0,<0.31.0",
    "email-validator>=2.0.0,<2.3.0",
    "fastapi>=0.115.0,<0.116.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyjwt>=2.10.0,<2.11.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2,<0.29.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.26.0",
    "ruff>=0.7.0,<0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
