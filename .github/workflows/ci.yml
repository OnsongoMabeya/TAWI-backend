name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.15"

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies from lock file
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest -q

  docker:
    name: Docker image builds and serves /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t tawi-backend:ci .

      - name: Run container and probe /health
        run: |
          docker run -d --name tawi-backend -p 8000:8000 tawi-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "\n/health responded on attempt $attempt"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health never became available"
          docker logs tawi-backend
          exit 1

      - name: Container logs
        if: always()
        run: docker logs tawi-backend || true
