name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.15"

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      # Tests always run against real Postgres — see tests/conftest.py.
      TAWI_TEST_DATABASE_URL: postgresql+asyncpg://tawi:tawi@127.0.0.1:5432/tawi_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tawi
          POSTGRES_PASSWORD: tawi
          POSTGRES_DB: tawi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tawi -d tawi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact tag: this action stopped publishing floating major tags after v7,
      # so `@v10` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies from lock file
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      # No explicit migration step: the suite's session fixture resets the schema
      # and runs `alembic upgrade head` from scratch on every CI run.
      - name: Test (pytest)
        run: uv run pytest -q

  docker:
    name: Docker image builds and serves /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t tawi-backend:ci .

      - name: Run container and probe /health
        run: |
          docker run -d --name tawi-backend -p 8000:8000 tawi-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "\n/health responded on attempt $attempt"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health never became available"
          docker logs tawi-backend
          exit 1

      - name: Container logs
        if: always()
        run: docker logs tawi-backend || true
