# Local development services only. There is no `app` service here on purpose:
# run the API itself with `uv run uvicorn` so edits reload instantly.
# In CI, the equivalent is the postgres service container in .github/workflows/ci.yml.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tawi
      POSTGRES_PASSWORD: tawi
      POSTGRES_DB: tawi
    # 5433 keeps clear of any host Postgres already on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tawi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tawi -d tawi"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tawi-db:
