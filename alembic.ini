[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d-%%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is intentionally unset — alembic/env.py reads TAWI_DATABASE_URL
# at runtime so the DSN lives in exactly one place (the environment).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
